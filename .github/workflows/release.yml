name: Release Obsidian plugin

on:
  release:
    types: [created]
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and attach the assets to
        required: true

permissions:
  contents: write

env:
  PLUGIN_NAME: obsidian-export-image
  RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Build plugin
        run: npm run build

      - name: Package plugin
        run: |
          mkdir ${{ env.PLUGIN_NAME }}
          cp main.js manifest.json styles.css ${{ env.PLUGIN_NAME }}
          zip -r ${{ env.PLUGIN_NAME }}-${{ env.RELEASE_TAG }}.zip ${{ env.PLUGIN_NAME }}

      - name: Resolve release notes
        id: notes
        run: |
          if [ -f "release-notes/${RELEASE_TAG}.md" ]; then
            echo "path=release-notes/${RELEASE_TAG}.md" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ steps.notes.outputs.path == '' }}
          files: |
            main.js
            manifest.json
            styles.css
            ${{ env.PLUGIN_NAME }}-${{ env.RELEASE_TAG }}.zip
